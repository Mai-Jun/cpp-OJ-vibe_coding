<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OnlineJudge - 在线判题系统</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <h1>Online Judge</h1>
    <div class="auth-card">
      <p id="welcome">欢迎使用在线判题系统。</p>
      <div id="guestBox">
        <p class="meta"><a href="/login.html">去登录</a></p>
        <p class="meta">还没有账号？<a href="/register.html">立即注册</a></p>
      </div>
      <div id="userBox" style="display:none;">
        <p class="meta"><a href="/problems.html">进入题库</a></p>
        <p class="meta"><a href="/submissions.html">我的提交记录</a></p>
        <p class="meta" id="adminLink" style="display:none;"><a href="/admin.html">管理后台</a></p>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    (function () {
      const s = getSession();
      if (s && s.username) {
        document.getElementById("welcome").textContent = `欢迎回来，${s.username}`;
        document.getElementById("guestBox").style.display = "none";
        document.getElementById("userBox").style.display = "";
        if (s.role === "admin") document.getElementById("adminLink").style.display = "";
      }
    })();
  </script>
</body>
</html>
